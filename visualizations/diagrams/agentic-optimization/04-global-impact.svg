<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img"><title>GEAK：选择真正值得优化的模块</title><rect width="100%" height="100%" rx="14" fill="#fff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="450" y="38" font-size="25" text-anchor="middle" fill="#1e293b" font-weight="700">GEAK：选择真正值得优化的模块</text><text x="450" y="76" font-size="19" text-anchor="middle" fill="#1e293b">假设：一次关键路径耗时 100 ms，无跨模块重叠</text><text x="35" y="134" font-size="19" text-anchor="start" fill="#334155">Attention</text><rect x="210" y="115" width="486.00000000000006" height="25" rx="4" fill="#1d4ed8"/><text x="711" y="134" font-size="18" text-anchor="start" fill="#1d4ed8" font-weight="700">45 ms</text><text x="35" y="180" font-size="19" text-anchor="start" fill="#334155">MoE / GEMM</text><rect x="210" y="161" width="324" height="25" rx="4" fill="#0f766e"/><text x="549" y="180" font-size="18" text-anchor="start" fill="#0f766e" font-weight="700">30 ms</text><text x="35" y="226" font-size="19" text-anchor="start" fill="#334155">通信</text><rect x="210" y="207" width="162" height="25" rx="4" fill="#b45309"/><text x="387" y="226" font-size="18" text-anchor="start" fill="#b45309" font-weight="700">15 ms</text><text x="35" y="272" font-size="19" text-anchor="start" fill="#334155">调度</text><rect x="210" y="253" width="86.4" height="25" rx="4" fill="#6d28d9"/><text x="311.4" y="272" font-size="18" text-anchor="start" fill="#6d28d9" font-weight="700">8 ms</text><text x="35" y="318" font-size="19" text-anchor="start" fill="#334155">其他</text><rect x="210" y="299" width="21.6" height="25" rx="4" fill="#475569"/><text x="246.6" y="318" font-size="18" text-anchor="start" fill="#475569" font-weight="700">2 ms</text><line x1="35" y1="350" x2="865" y2="350" stroke="#64748b" stroke-width="2" /><rect x="40" y="370" width="390" height="80" rx="10" stroke="#475569" stroke-width="1.6" fill="#f1f5f9"/><text x="235" y="399" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">优化其他：10×</text><text x="235" y="423" font-size="17" text-anchor="middle" fill="#1e293b">节省 1.8 ms；全局 1.018×</text><rect x="470" y="370" width="390" height="80" rx="10" stroke="#0f766e" stroke-width="1.6" fill="#f0fdfa"/><text x="665" y="399" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="700">优化 Attention：1.25×</text><text x="665" y="423" font-size="17" text-anchor="middle" fill="#1e293b">节省 9 ms；全局 1.099×</text><text x="450" y="482" font-size="17" text-anchor="middle" fill="#475569">优先研究全局收益，而不是追逐最大的局部加速倍数。</text></g></svg>