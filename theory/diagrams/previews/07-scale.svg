<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="07｜多卡与服务"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="56" y="50.32" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#2765D8"><tspan x="56" dy="0">系统层优化</tspan></text><text x="56" y="107.615" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#14243B"><tspan x="56" dy="0">更多实例，不等于随意增加 GPU</tspan></text><text x="56" y="160.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="56" dy="0">比较 T007 / T012 时，始终保持整套服务的 H800 总数量相同。</tspan></text><line x1="56" y1="188" x2="1544" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="56" y="873.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="56" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1543" y="873.295" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="1543" dy="0">07</tspan></text><rect x="57" y="240" width="876" height="457" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="84" y="292.875" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#2765D8"><tspan x="84" dy="0">相同 GPU 预算下的两种部署形态</tspan></text><rect x="92" y="330" width="142" height="33" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="163" y="351.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2765D8"><tspan x="163" dy="0">单实例混跑</tspan></text><rect x="91" y="393" width="272" height="130" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="229" y="448.74" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2765D8"><tspan x="229" dy="0">同一实例</tspan><tspan x="229" dy="31.9">Prefill + Decode</tspan></text><line x1="374" y1="458" x2="466" y2="458" stroke="#14243B" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="330" width="154" height="33" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="562" y="351.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#078E87"><tspan x="562" dy="0">P/D 分离</tspan></text><rect x="485" y="391" width="182" height="128" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="575.5" y="448.74" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#078E87"><tspan x="575.5" dy="0">P 节点</tspan><tspan x="575.5" dy="31.9">长输入</tspan></text><line x1="674" y1="455" x2="725" y2="455" stroke="#078E87" stroke-width="3" marker-end="url(#arrow)"/><rect x="737" y="391" width="163" height="128" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="818.5" y="448.74" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#7655C2"><tspan x="818.5" dy="0">D 节点</tspan><tspan x="818.5" dy="31.9">逐 token</tspan></text><text x="95" y="606.9" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#60718A"><tspan x="95" dy="0">P/D 分离还要核算状态传输、负载比例与跨节点链路。</tspan><tspan x="95" dy="29">未确认引擎支持前，不把它当已经可用的功能。</tspan></text><rect x="971" y="240" width="571" height="457" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="999" y="293.375" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#7655C2"><tspan x="999" dy="0">并行布局 T007</tspan></text><rect x="1003" y="327" width="506" height="84" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="1052" y="376.085" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#2765D8"><tspan x="1052" dy="0">TP</tspan></text><text x="1107" y="375.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1107" dy="0">张量并行：算子与 collective</tspan></text><rect x="1003" y="437" width="506" height="84" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="1052" y="486.085" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#078E87"><tspan x="1052" dy="0">EP</tspan></text><text x="1107" y="485.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1107" dy="0">专家并行：路由与 all-to-all</tspan></text><rect x="1003" y="547" width="506" height="84" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="1052" y="596.085" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#C9771A"><tspan x="1052" dy="0">DP</tspan></text><text x="1107" y="595.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1107" dy="0">数据并行：副本与请求分发</tspan></text><rect x="57" y="733" width="1486" height="87" rx="16" fill="#EDF2F9" stroke="#DCE5F0" stroke-width="1.4"/><text x="801" y="784.4" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="801" dy="0">服务吞吐的公允比较：总 tok/s、每卡 tok/s、TTFT/TPOT 尾延迟、跨卡通信与实际 GPU 账。</tspan></text></svg>
