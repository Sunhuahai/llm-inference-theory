<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="09｜从预测到校准"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="56" y="50.32" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#2765D8"><tspan x="56" dy="0">模型闭环</tspan></text><text x="56" y="107.615" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#14243B"><tspan x="56" dy="0">每晚反馈，都会让下一次预测更可信</tspan></text><text x="56" y="160.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="56" dy="0">先从可复核的 A/B 建立校准，再谈统计学习；没有数据就保留区间。</tspan></text><line x1="56" y1="188" x2="1544" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="56" y="873.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="56" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1543" y="873.295" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="1543" dy="0">09</tspan></text><rect x="60" y="247" width="337" height="222" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="82" y="263" width="55" height="33" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="109.5" y="284.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2765D8"><tspan x="109.5" dy="0">01</tspan></text><text x="85" y="342.375" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="85" dy="0">先预测</tspan></text><text x="85" y="400.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="85" dy="0">保守 / 中心 / 乐观</tspan><tspan x="85" dy="26.1">记录局部成本与适用条件</tspan></text><line x1="403" y1="359" x2="430" y2="359" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="247" width="337" height="222" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="460" y="263" width="55" height="33" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="487.5" y="284.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#078E87"><tspan x="487.5" dy="0">02</tspan></text><text x="463" y="342.375" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="463" dy="0">再实验</tspan></text><text x="463" y="400.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="463" dy="0">同版本、同 GPU、同 trace</tspan><tspan x="463" dy="26.1">留出测试负载</tspan></text><line x1="781" y1="359" x2="808" y2="359" stroke="#078E87" stroke-width="3" marker-end="url(#arrow)"/><rect x="816" y="247" width="337" height="222" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="838" y="263" width="55" height="33" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="865.5" y="284.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#C9771A"><tspan x="865.5" dy="0">03</tspan></text><text x="841" y="342.375" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="841" dy="0">看误差</tspan></text><text x="841" y="400.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="841" dy="0">(预测 − 实测) / 实测</tspan><tspan x="841" dy="26.1">逐指标分析原因</tspan></text><line x1="1159" y1="359" x2="1186" y2="359" stroke="#C9771A" stroke-width="3" marker-end="url(#arrow)"/><rect x="1194" y="247" width="337" height="222" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="1216" y="263" width="55" height="33" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="1243.5" y="284.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#7655C2"><tspan x="1243.5" dy="0">04</tspan></text><text x="1219" y="342.375" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="1219" dy="0">更新模型</tspan></text><text x="1219" y="400.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="1219" dy="0">修正重叠、额外成本</tspan><tspan x="1219" dy="26.1">和饱和资源因子</tspan></text><rect x="61" y="527" width="1477" height="223" rx="16" fill="#EDF2F9" stroke="#DCE5F0" stroke-width="1.4"/><text x="94" y="575.77" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#14243B"><tspan x="94" dy="0">合成算例：为什么不能只报一个指标？</tspan></text><rect x="97" y="618" width="426" height="105" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="113" y="653.505" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#2765D8"><tspan x="113" dy="0">QSA 保守情景</tspan></text><text x="113" y="695.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#14243B"><tspan x="113" dy="0">TPOT 22 → 20.25 ms</tspan></text><rect x="568" y="618" width="426" height="105" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="584" y="653.505" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#7655C2"><tspan x="584" dy="0">MTP 假设情景</tspan></text><text x="584" y="695.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#14243B"><tspan x="584" dy="0">TPOT 22 → 15.87 ms</tspan></text><rect x="1041" y="618" width="426" height="105" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1057" y="653.505" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#C64F64"><tspan x="1057" dy="0">但 MTP 容量</tspan></text><text x="1057" y="695.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#14243B"><tspan x="1057" dy="0">1800 → 1579 tok/s</tspan></text><rect x="60" y="773" width="1477" height="53" rx="16" fill="#FFF1DB" stroke="#FFE1B0" stroke-width="1.4"/><text x="798" y="805.61" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#C9771A"><tspan x="798" dy="0">上面都是合成数字，不是 H800 成绩。真实性 = 可追溯版本 + 原始结果 + 误差记录。</tspan></text></svg>
