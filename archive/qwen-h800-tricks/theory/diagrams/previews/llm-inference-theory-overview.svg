<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1140" viewBox="0 0 1680 1140" role="img" aria-labelledby="title desc">
<title id="title">LLM 推理全局关系图：任务、执行、状态、资源与服务</title>
<desc id="desc">请求进入共享调度器。Prefill 创建状态并生成首 token；Decode 读取与更新状态，反复生成。调度决定每批 token 与资源分配，状态可用容量反过来限制调度。算子执行受计算、数据移动和通信边界约束。执行时间、生成数量、等待和干扰共同决定服务指标。底部说明批处理、缓存、自回归生成与并行的跨模块相互作用。</desc>
<defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F8A"/></marker><marker id="at-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#087F8A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315F91"/></marker><marker id="ab-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#315F91"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#67578E"/></marker><marker id="ap-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#67578E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8598A8"/></marker><marker id="ag-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#8598A8"/></marker></defs>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Hiragino Sans GB, WenQuanYi Micro Hei, Arial, sans-serif">
<rect x="0" y="0" width="1680" height="1140" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="48" y="50" font-size="39" fill="#172F47" font-weight="700" text-anchor="start">LLM 推理全局关系图</text>
<text x="48" y="83" font-size="24" fill="#50677B" font-weight="400" text-anchor="start">从模型执行到在线服务：共享资源、持久状态与生成依赖如何共同决定性能</text>
<text x="1632" y="49" font-size="18" fill="#50677B" font-weight="600" text-anchor="end">SYSTEM MAP  /  THEORY v1.1</text>
<rect x="48" y="110" width="1584" height="80" rx="10" fill="#F2F6F9" stroke="#D6E0E8" stroke-width="1.5"/>
<text x="70" y="137" font-size="19" fill="#50677B" font-weight="700" text-anchor="start">给定条件</text>
<text x="70" y="166" font-size="25" fill="#172F47" font-weight="600" text-anchor="start">模型结构与语义</text>
<text x="302" y="166" font-size="21" fill="#50677B" font-weight="400" text-anchor="start">决定 f、w、k、κ 及允许的近似</text>
<polyline points="689,126 689,176" fill="none" stroke="#CCD9E3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="719" y="137" font-size="19" fill="#50677B" font-weight="700" text-anchor="start">工作负载</text>
<text x="719" y="166" font-size="22" fill="#172F47" font-weight="500" text-anchor="start">到达率 λ · 输入/输出长度 · 前缀共享 · 质量与 SLO</text>
<polyline points="278,281 342,281" fill="none" stroke="#087F8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)"/>
<polyline points="584,327 584,385" fill="none" stroke="#315F91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
