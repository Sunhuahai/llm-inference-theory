<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="03｜收益预测与实验校准"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1920" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="64" y="48.215" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2765D8"><tspan x="64" dy="0">PREDICTION / PROFILE CALIBRATION / VALIDATION</tspan></text><text x="64" y="109.405" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="39" font-weight="700" fill="#14243B"><tspan x="64" dy="0">优化收益预测模型与实验校准</tspan></text><text x="64" y="161.505" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#60718A"><tspan x="64" dy="0">Amdahl / Roofline / 重叠关键路径 / MTP / 饱和资源容量分账计算，并以真实 H800 A/B 迭代校准。</tspan></text><line x1="64" y1="188" x2="1856" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="64" y="1055.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="64" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1855" y="1057.19" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2765D8"><tspan x="1855" dy="0">03</tspan></text><rect x="64" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="64" y="220" width="8" height="123" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="86" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="86" dy="0">输入 A · 实测基线</tspan></text><text x="87" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="87" dy="0">同 trace 的 TTFT、TPOT 均值；Prefill、首步时间；</tspan><tspan x="87" dy="24.65">相同 workload 下的饱和输出 tok/s。</tspan></text><rect x="673" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="673" y="220" width="8" height="123" rx="0" fill="#078E87" stroke="#078E87" stroke-width="1.4"/><text x="695" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="695" dy="0">输入 B · Profile</tspan></text><text x="696" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="696" dy="0">互斥 block 的串行 / 计算 / 通信时间与 overlap；</tspan><tspan x="696" dy="24.65">各资源 busy / bytes / cost，形状相关的下界。</tspan></text><rect x="1282" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="1282" y="220" width="8" height="123" rx="0" fill="#7655C2" stroke="#7655C2" stroke-width="1.4"/><text x="1304" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="1304" dy="0">输入 C · 候选方案</tspan></text><text x="1305" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="1305" dy="0">k_s、k_c、k_m、η′、新增开销；</tspan><tspan x="1305" dy="24.65">资源需求因子 f_r；MTP 的 p、d 与验证成本。</tspan></text><rect x="64" y="369" width="1102" height="466" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="89" y="407.77" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#2765D8"><tspan x="89" dy="0">关键路径与理论下界</tspan></text><rect x="87" y="428" width="516" height="178" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="107" y="465.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="107" dy="0">01  ·  Amdahl + Overlap</tspan></text><text x="107" y="527.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="107" dy="0">t′_b = s/k_s + c′ + m′ − η′ min(c′,m′) + h</tspan><tspan x="107" dy="26.1">T′stage ≈ Tstage,0 × (Σt′struct / Σt_0) + Σh</tspan></text><rect x="637" y="428" width="516" height="178" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="657" y="465.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#078E87"><tspan x="657" dy="0">02  ·  Roofline 下界</tspan></text><text x="657" y="527.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="657" dy="0">c′ ≥ max(c/k_c, ℓ_compute)</tspan><tspan x="657" dy="26.1">ℓ_compute ≥ max(F/P_eff, Bytes/BW_eff)</tspan></text><rect x="87" y="626" width="516" height="178" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="107" y="663.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#7655C2"><tspan x="107" dy="0">03  ·  MTP 净 token 成本</tspan></text><text x="107" y="725.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="107" dy="0">E[K] = Σ(i=0..d) p^i</tspan><tspan x="107" dy="26.1">TPOT_MTP ≈ (k_verify · T_decode + h_draft) / E[K]</tspan></text><rect x="637" y="626" width="516" height="178" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="657" y="663.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#C9771A"><tspan x="657" dy="0">04  ·  饱和容量约束</tspan></text><text x="657" y="725.56" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="657" dy="0">R′cap = R0 · max(u_r) / max(u_r f_r)</tspan><tspan x="657" dy="26.1">R_served ≤ min(λ × E[O], R′cap)</tspan></text><rect x="1199" y="369" width="656" height="466" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1221" y="409.875" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#7655C2"><tspan x="1221" dy="0">合成情景：三项指标可能相反</tspan></text><rect x="1221" y="428" width="215" height="33" rx="16" fill="#FBEAF0" stroke="#FBEAF0" stroke-width="1.4"/><text x="1328.5" y="449.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#C64F64"><tspan x="1328.5" dy="0">SYNTHETIC · 非实测</tspan></text><rect x="1222" y="482" width="610" height="47" rx="0" fill="#E9EEF5" stroke="#E9EEF5" stroke-width="1.4"/><text x="1233" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1233" dy="0">情景</tspan></text><text x="1400" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1400" dy="0">TTFT ms</tspan></text><text x="1518" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1518" dy="0">TPOT ms</tspan></text><text x="1650" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1650" dy="0">输出 tok/s</tspan></text><rect x="1222" y="531" width="610" height="53" rx="0" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="563.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2765D8"><tspan x="1233" dy="0">Baseline</tspan></text><text x="1400" y="563.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1400" dy="0">150.00</tspan></text><text x="1518" y="563.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1518" dy="0">22.00</tspan></text><text x="1650" y="563.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1650" dy="0">1800.00</tspan></text><rect x="1222" y="585" width="610" height="53" rx="0" fill="#F4F7FA" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="617.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#078E87"><tspan x="1233" dy="0">QSA 融合</tspan></text><text x="1400" y="617.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1400" dy="0">148.33</tspan></text><text x="1518" y="617.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1518" dy="0">20.25</tspan></text><text x="1650" y="617.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1650" dy="0">1894.74</tspan></text><rect x="1222" y="639" width="610" height="53" rx="0" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="671.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#C9771A"><tspan x="1233" dy="0">MTP 假设</tspan></text><text x="1400" y="671.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1400" dy="0">150.00*</tspan></text><text x="1518" y="671.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1518" dy="0">15.87</tspan></text><text x="1650" y="671.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1650" dy="0">1578.95</tspan></text><text x="1225" y="745.01" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="1225" dy="0">MTP 可改善单请求 TPOT，却因新增资源需求而</tspan><tspan x="1225" dy="26.1">降低饱和容量。*首 token 影响尚未建模。</tspan><tspan x="1225" dy="26.1">无真实 profile 时仅输出情景，不宣称 H800 加速。</tspan></text><rect x="64" y="859" width="1791" height="152" rx="16" fill="#EDF2F9" stroke="#DCE5F0" stroke-width="1.4"/><text x="85" y="893.085" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#14243B"><tspan x="85" dy="0">模型校准与验证闭环</tspan></text><rect x="88" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="277" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="277" dy="0">固定基线</tspan></text><text x="279.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="279.5" dy="0">模型 / 精度 / GPU / trace</tspan></text><line x1="477" y1="947" x2="519" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="531" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="720" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="720" dy="0">三档预测</tspan></text><text x="722.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="722.5" dy="0">保守 / 中心 / 乐观</tspan></text><line x1="920" y1="947" x2="962" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="974" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1163" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="1163" dy="0">单变量 A/B</tspan></text><text x="1165.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="1165.5" dy="0">均值 + 分位数 + 质量</tspan></text><line x1="1363" y1="947" x2="1405" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1417" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1606" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="1606" dy="0">误差更新</tspan></text><text x="1608.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="1608.5" dy="0">(预测−实测)/实测；留出集</tspan></text><text x="960" y="1027.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#C64F64"><tspan x="960" dy="0">可运行实现：theory/predictor/predict.py    ·    未输入真实基线前不预测 p95/p99、排队 TTFT 或 P/D 调度收益。</tspan></text></svg>
