<polyline points="981,525 981,585" fill="none" stroke="#087F8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)" marker-start="url(#at-back)"/>
<polyline points="393,650 313,650 313,303 342,303" fill="none" stroke="#67578E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ap)"/>
<polyline points="460,744 460,711" fill="none" stroke="#67578E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ap)"/>
