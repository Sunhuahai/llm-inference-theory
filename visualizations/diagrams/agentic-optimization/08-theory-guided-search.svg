<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img"><title>从经验驱动到理论引导的优化搜索</title><rect width="100%" height="100%" rx="14" fill="#fff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="450" y="38" font-size="25" text-anchor="middle" fill="#1e293b" font-weight="700">从经验驱动到理论引导的优化搜索</text><text x="235" y="82" font-size="23" text-anchor="middle" fill="#475569" font-weight="700">普通 Coding Agent</text><text x="665" y="82" font-size="23" text-anchor="middle" fill="#1d4ed8" font-weight="700">理论引导 Agent</text><rect x="40" y="108" width="390" height="64" rx="10" stroke="#475569" stroke-width="1.6" fill="#f1f5f9"/><text x="235" y="137" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">阅读代码</text><text x="235" y="161" font-size="17" text-anchor="middle" fill="#1e293b">提出可能的方向</text><line x1="235" y1="172" x2="235" y2="196" stroke="#64748b" stroke-width="2" /><path d="M230.21537912477646 186.09508187412055 L235 196 L239.78462087522354 186.09508187412055" stroke="#64748b" stroke-width="2" fill="none"/><rect x="40" y="196" width="390" height="64" rx="10" stroke="#475569" stroke-width="1.6" fill="#f1f5f9"/><text x="235" y="225" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">实现候选</text><text x="235" y="249" font-size="17" text-anchor="middle" fill="#1e293b">运行测试和 GPU 实验</text><line x1="235" y1="260" x2="235" y2="284" stroke="#64748b" stroke-width="2" /><path d="M230.21537912477646 274.0950818741206 L235 284 L239.78462087522354 274.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><rect x="40" y="284" width="390" height="64" rx="10" stroke="#475569" stroke-width="1.6" fill="#f1f5f9"/><text x="235" y="313" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">判断结果</text><text x="235" y="337" font-size="17" text-anchor="middle" fill="#1e293b">根据反馈再尝试</text><rect x="470" y="108" width="390" height="64" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="665" y="137" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="700">资源与关键路径模型</text><text x="665" y="161" font-size="17" text-anchor="middle" fill="#1e293b">确定可优化的性能空间</text><line x1="665" y1="172" x2="665" y2="196" stroke="#64748b" stroke-width="2" /><path d="M660.2153791247765 186.09508187412055 L665 196 L669.7846208752235 186.09508187412055" stroke="#64748b" stroke-width="2" fill="none"/><rect x="470" y="196" width="390" height="64" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="665" y="225" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="700">候选价值预测</text><text x="665" y="249" font-size="17" text-anchor="middle" fill="#1e293b">筛除低收益方向，保留多条路径</text><line x1="665" y1="260" x2="665" y2="284" stroke="#64748b" stroke-width="2" /><path d="M660.2153791247765 274.0950818741206 L665 284 L669.7846208752235 274.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><rect x="470" y="284" width="390" height="64" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="665" y="313" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="700">实现与独立评价</text><text x="665" y="337" font-size="17" text-anchor="middle" fill="#1e293b">实测修正预测并更新知识</text><line x1="235" y1="348" x2="235" y2="380" stroke="#64748b" stroke-width="2" /><path d="M230.21537912477646 370.0950818741206 L235 380 L239.78462087522354 370.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><line x1="665" y1="348" x2="665" y2="380" stroke="#64748b" stroke-width="2" /><path d="M660.2153791247765 370.0950818741206 L665 380 L669.7846208752235 370.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><rect x="45" y="380" width="810" height="75" rx="10" stroke="#0f766e" stroke-width="1.6" fill="#f0fdfa"/><text x="450" y="407" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="700">同一个独立评价器</text><text x="450" y="436" font-size="18" text-anchor="middle" fill="#1e293b">固定模型 / 精度 / 负载 / GPU 与 Agent 预算</text><text x="450" y="486" font-size="18" text-anchor="middle" fill="#475569">比较最终性能、有效候选比例、实验成本和泛化稳定性。</text></g></svg>