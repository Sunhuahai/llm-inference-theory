<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>四项代表性工作的互补关系</title><rect width="100%" height="100%" rx="14" fill="#fff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="450" y="38" font-size="25" text-anchor="middle" fill="#1e293b" font-weight="700">四项代表性工作的互补关系</text><rect x="35" y="64" width="830" height="68" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="55" y="90" font-size="22" text-anchor="start" fill="#1d4ed8" font-weight="700">KernelEvolve</text><text x="290" y="90" font-size="20" text-anchor="start" fill="#1e293b">怎样找到更好的实现？</text><text x="290" y="115" font-size="18" text-anchor="start" fill="#475569">分支探索与选择</text><rect x="35" y="153" width="830" height="68" rx="10" stroke="#6d28d9" stroke-width="1.6" fill="#f5f3ff"/><text x="55" y="179" font-size="22" text-anchor="start" fill="#6d28d9" font-weight="700">KernelAgent</text><text x="290" y="179" font-size="20" text-anchor="start" fill="#1e293b">怎样减少盲目尝试？</text><text x="290" y="204" font-size="18" text-anchor="start" fill="#475569">硬件反馈与诊断</text><rect x="35" y="242" width="830" height="68" rx="10" stroke="#b45309" stroke-width="1.6" fill="#fffbeb"/><text x="55" y="268" font-size="22" text-anchor="start" fill="#b45309" font-weight="700">GEAK v4</text><text x="290" y="268" font-size="20" text-anchor="start" fill="#1e293b">应该先优化哪里？</text><text x="290" y="293" font-size="18" text-anchor="start" fill="#475569">系统影响与独立验证</text><rect x="35" y="331" width="830" height="68" rx="10" stroke="#0f766e" stroke-width="1.6" fill="#f0fdfa"/><text x="55" y="357" font-size="22" text-anchor="start" fill="#0f766e" font-weight="700">SEIS</text><text x="290" y="357" font-size="20" text-anchor="start" fill="#1e293b">怎样持续改进整个系统？</text><text x="290" y="382" font-size="18" text-anchor="start" fill="#475569">跨轮继承与协作</text><text x="450" y="432" font-size="17" text-anchor="middle" fill="#475569">这些能力可以组合；四个项目并非线性继承或统一的成熟度