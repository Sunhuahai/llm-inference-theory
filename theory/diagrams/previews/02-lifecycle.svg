<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="02｜请求生命周期"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="56" y="50.32" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#2765D8"><tspan x="56" dy="0">请求旅程</tspan></text><text x="56" y="107.615" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#14243B"><tspan x="56" dy="0">一个 token 从哪里来？</tspan></text><text x="56" y="160.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="56" dy="0">TTFT 关注首 token 之前，TPOT 关注后续 token 的节拍。</tspan></text><line x1="56" y1="188" x2="1544" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="56" y="873.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="56" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1543" y="873.295" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="1543" dy="0">02</tspan></text><rect x="58" y="265" width="257" height="154" rx="16" fill="#EDF1F6" stroke="#EDF1F6" stroke-width="1.4"/><text x="186" y="316.375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="186" dy="0">请求到达</tspan></text><text x="186" y="368.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="186" dy="0">tokenize / 接入</tspan></text><line x1="322" y1="341" x2="356" y2="341" stroke="#60718A" stroke-width="3" marker-end="url(#arrow)"/><rect x="367" y="265" width="257" height="154" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="495" y="316.375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="495" dy="0">等待调度</tspan></text><text x="495" y="368.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#C9771A"><tspan x="495" dy="0">队列 / batch</tspan></text><line x1="631" y1="341" x2="665" y2="341" stroke="#C9771A" stroke-width="3" marker-end="url(#arrow)"/><rect x="676" y="265" width="257" height="154" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="804" y="316.375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="804" dy="0">Prefill</tspan></text><text x="804" y="368.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#2765D8"><tspan x="804" dy="0">处理输入 token</tspan></text><line x1="940" y1="341" x2="974" y2="341" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="985" y="265" width="257" height="154" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="1113" y="316.375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="1113" dy="0">首个 Decode</tspan></text><text x="1113" y="368.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#078E87"><tspan x="1113" dy="0">产生首 token</tspan></text><line x1="1249" y1="341" x2="1283" y2="341" stroke="#078E87" stroke-width="3" marker-end="url(#arrow)"/><rect x="1294" y="265" width="257" height="154" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="1422" y="316.375" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#14243B"><tspan x="1422" dy="0">后续 Decode</tspan></text><text x="1422" y="368.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#7655C2"><tspan x="1422" dy="0">循环逐 token</tspan></text><line x1="75" y1="477" x2="1107" y2="477" stroke="#2765D8" stroke-width="5" marker-end="url(#arrow)"/><text x="690" y="519.69" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2765D8"><tspan x="690" dy="0">TTFT = 到达请求 → 收到首个有效生成 token</tspan></text><line x1="1153" y1="477" x2="1518" y2="477" stroke="#7655C2" stroke-width="5" marker-end="url(#arrow)"/><text x="1326.5" y="521.61" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7655C2"><tspan x="1326.5" dy="0">TPOT：后续 token 的平均间隔</tspan></text><rect x="58" y="588" width="466" height="185" rx="18" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="58" y="588" width="8" height="185" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="83" y="632.085" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#14243B"><tspan x="83" dy="0">TTFT</tspan></text><text x="83" y="697.07" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#60718A"><tspan x="83" dy="0">排队 + 预处理 + Prefill</tspan><tspan x="83" dy="30.45">+ 首个 Decode + 传输</tspan></text><rect x="565" y="588" width="467" height="185" rx="18" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="565" y="588" width="8" height="185" rx="0" fill="#7655C2" stroke="#7655C2" stroke-width="1.4"/><text x="590" y="632.085" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#14243B"><tspan x="590" dy="0">TPOT</tspan></text><text x="590" y="697.4" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#60718A"><tspan x="590" dy="0">后续 N 个 token 的总时间</tspan><tspan x="590" dy="29">除以 N；多 token chunk 要摊开</tspan></text><rect x="1072" y="588" width="469" height="185" rx="18" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="1072" y="588" width="8" height="185" rx="0" fill="#078E87" stroke="#078E87" stroke-width="1.4"/><text x="1097" y="632.085" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#14243B"><tspan x="1097" dy="0">输出吞吐</tspan></text><text x="1097" y="697.4" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#60718A"><tspan x="1097" dy="0">在给定并发/到达率下</tspan><tspan x="1097" dy="29">单位时间实际交付的 token 数</tspan></text></svg>
