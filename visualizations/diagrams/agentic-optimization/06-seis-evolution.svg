<svg xmlns="http://www.w3.org/2000/svg" width="900" height="535" viewBox="0 0 900 535" role="img"><title>SEIS：继承经验并演化整个推理引擎</title><rect width="100%" height="100%" rx="14" fill="#fff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="450" y="38" font-size="25" text-anchor="middle" fill="#1e293b" font-weight="700">SEIS：继承经验并演化整个推理引擎</text><text x="450" y="72" font-size="18" text-anchor="middle" fill="#1e293b">同一 Agent；被优化的是推理引擎代码，而非 Agent 权重</text><rect x="35" y="100" width="250" height="65" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="160" y="129" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="700">会话 1</text><text x="160" y="153" font-size="17" text-anchor="middle" fill="#1e293b">继承原始代码</text><line x1="285" y1="132" x2="325" y2="132" stroke="#64748b" stroke-width="2" /><path d="M315.0950818741206 136.78462087522354 L325 132 L315.0950818741206 127.21537912477646" stroke="#64748b" stroke-width="2" fill="none"/><rect x="325" y="100" width="250" height="65" rx="10" stroke="#6d28d9" stroke-width="1.6" fill="#f5f3ff"/><text x="450" y="129" font-size="22" text-anchor="middle" fill="#6d28d9" font-weight="700">会话 2</text><text x="450" y="153" font-size="17" text-anchor="middle" fill="#1e293b">继承代码与报告</text><line x1="575" y1="132" x2="615" y2="132" stroke="#64748b" stroke-width="2" /><path d="M605.0950818741205 136.78462087522354 L615 132 L605.0950818741205 127.21537912477646" stroke="#64748b" stroke-width="2" fill="none"/><rect x="615" y="100" width="250" height="65" rx="10" stroke="#0f766e" stroke-width="1.6" fill="#f0fdfa"/><text x="740" y="129" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="700">会话 3</text><text x="740" y="153" font-size="17" text-anchor="middle" fill="#1e293b">继承正负结果</text><path d="M160 165 V191 H740 V165" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" fill="none"/><text x="450" y="217" font-size="18" text-anchor="middle" fill="#6d28d9">平行演化链可以交换已验证发现</text><line x1="40" y1="239" x2="860" y2="239" stroke="#64748b" stroke-width="2" /><text x="450" y="273" font-size="21" text-anchor="middle" fill="#1e293b" font-weight="700">公开实验：Qwen3-0.6B / H100 / 单请求</text><text x="35" y="312" font-size="18" text-anchor="start" fill="#334155">mini-sglang</text><rect x="240" y="294" width="159.05252317198764" height="23" rx="4" fill="#94a3b8"/><text x="409.0525231719877" y="312" font-size="17" text-anchor="start" fill="#475569" font-weight="700">594 tok/s</text><text x="35" y="349" font-size="18" text-anchor="start" fill="#334155">SGLang</text><rect x="240" y="331" width="167.62100926879504" height="23" rx="4" fill="#94a3b8"/><text x="417.62100926879504" y="349" font-size="17" text-anchor="start" fill="#475569" font-weight="700">626 tok/s</text><text x="35" y="386" font-size="18" text-anchor="start" fill="#334155">vLLM</text><rect x="240" y="368" width="169.49536560247168" height="23" rx="4" fill="#94a3b8"/><text x="419.4953656024717" y="386" font-size="17" text-anchor="start" fill="#475569" font-weight="700">633 tok/s</text><text x="35" y="423" font-size="18" text-anchor="start" fill="#334155">TensorRT-LLM</text><rect x="240" y="405" width="184.75798146240987" height="23" rx="4" fill="#94a3b8"/><text x="434.7579814624099" y="423" font-size="17" text-anchor="start" fill="#475569" font-weight="700">690 tok/s</text><text x="35" y="460" font-size="18" text-anchor="start" fill="#334155">SEIS best</text><rect x="240" y="442" width="520" height="23" rx="4" fill="#0f766e"/><text x="770" y="460" font-size="17" text-anchor="start" fill="#0f766e" font-weight="700">1942 tok/s</text><text x="450" y="510" font-size="16" text-anchor="middle" fill="#475569">数据：SEIS 项目主页，100 条自然长度请求，含 Prefill；三次重复中位数。</text></g></svg>