<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#1e293b"><text x="450" y="37" text-anchor="middle" font-size="25" fill="#1e293b" font-weight="700">Amdahl 定律：局部优化的全局收益</text><text x="450" y="70" text-anchor="middle" font-size="18" fill="#1e293b">示例：目标模块占 40%，局部加速 5 倍；整体 1.47×</text><text x="70" y="123" text-anchor="start" font-size="20" fill="#1e293b">优化前</text><rect x="190" y="96" width="260" height="44" rx="5" fill="#2563eb"/><rect x="450" y="96" width="390" height="44" rx="5" fill="#94a3b8"/><text x="320" y="124" text-anchor="middle" font-size="20" fill="#ffffff">40%</text><text x="645" y="124" text-anchor="middle" font-size="20" fill="#ffffff">60%</text><text x="70" y="197" text-anchor="start" font-size="20" fill="#1e293b">优化后</text><rect x="190" y="170" width="52" height="44" rx="5" fill="#2563eb"/><rect x="242" y="170" width="390" height="44" rx="5" fill="#94a3b8"/><text x="216" y="198" text-anchor="middle" font-size="17" fill="#ffffff">8%</text><text x="437" y="198" text-anchor="middle" font-size="20" fill="#ffffff">60%</text><line x1="632" y1="226" x2="840" y2="226" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/><text x="736" y="252" text-anchor="middle" font-size="17" fill="#1e293b">节省 32% 原时间</text><text x="450" y="292" text-anchor="middle" font-size="19" fill="#1e293b">即使模块无限快，整体加速也不会超过 1.67×</text></g></svg>