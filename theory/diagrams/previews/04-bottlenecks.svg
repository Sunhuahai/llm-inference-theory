<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="04｜诊断瓶颈"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="56" y="50.32" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#2765D8"><tspan x="56" dy="0">理论到 PROFILE</tspan></text><text x="56" y="107.615" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#14243B"><tspan x="56" dy="0">延迟看关键路径；吞吐看最忙的资源</tspan></text><text x="56" y="160.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="56" dy="0">把两套账分开，是建立收益预测模型的第一步。</tspan></text><line x1="56" y1="188" x2="1544" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="56" y="873.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="56" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1543" y="873.295" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="1543" dy="0">04</tspan></text><rect x="58" y="225" width="712" height="447" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="86" y="279.665" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#2765D8"><tspan x="86" dy="0">A  ·  单请求关键路径</tspan></text><text x="88" y="330.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#60718A"><tspan x="88" dy="0">串行：Host  →  计算 / 通信重叠  →  输出</tspan></text><rect x="94" y="372" width="130" height="81" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="158" y="403.56" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2765D8"><tspan x="158" dy="0">Host</tspan><tspan x="158" dy="26.1">串行</tspan></text><line x1="233" y1="413" x2="284" y2="413" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="353" width="254" height="61" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="425" y="391.4" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#078E87"><tspan x="425" dy="0">GPU 计算 C</tspan></text><rect x="300" y="430" width="191" height="61" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="396" y="468.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#C9771A"><tspan x="396" dy="0">通信 M</tspan></text><line x1="567" y1="414" x2="643" y2="414" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="651" y="372" width="94" height="81" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="697.5" y="418.11" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7655C2"><tspan x="697.5" dy="0">输出</tspan></text><text x="90" y="570.4" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="90" dy="0">重叠块：C + M − η·min(C,M)</tspan><tspan x="90" dy="29">η = 1 时取 max(C,M)，不是 C + M</tspan></text><rect x="807" y="225" width="734" height="447" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="839" y="279.665" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#078E87"><tspan x="839" dy="0">B  ·  饱和容量的资源压力</tspan></text><text x="842" y="323.82" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="842" dy="0">以下数值仅用于示意，非 H800 测量</tspan></text><text x="841" y="380.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="841" dy="0">GPU 计算</tspan></text><rect x="1015" y="363" width="414" height="18" rx="9" fill="#EEF2F8" stroke="#EEF2F8" stroke-width="1.4"/><rect x="1015" y="363" width="377" height="18" rx="9" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="1510" y="379.715" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2765D8"><tspan x="1510" dy="0">91%</tspan></text><text x="841" y="444.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="841" dy="0">HBM</tspan></text><rect x="1015" y="427" width="414" height="18" rx="9" fill="#EEF2F8" stroke="#EEF2F8" stroke-width="1.4"/><rect x="1015" y="427" width="290" height="18" rx="9" fill="#078E87" stroke="#078E87" stroke-width="1.4"/><text x="1510" y="443.715" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#078E87"><tspan x="1510" dy="0">70%</tspan></text><text x="841" y="508.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="841" dy="0">互联通信</tspan></text><rect x="1015" y="491" width="414" height="18" rx="9" fill="#EEF2F8" stroke="#EEF2F8" stroke-width="1.4"/><rect x="1015" y="491" width="195" height="18" rx="9" fill="#C9771A" stroke="#C9771A" stroke-width="1.4"/><text x="1510" y="507.715" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#C9771A"><tspan x="1510" dy="0">47%</tspan></text><text x="841" y="572.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="841" dy="0">CPU</tspan></text><rect x="1015" y="555" width="414" height="18" rx="9" fill="#EEF2F8" stroke="#EEF2F8" stroke-width="1.4"/><rect x="1015" y="555" width="248" height="18" rx="9" fill="#7655C2" stroke="#7655C2" stroke-width="1.4"/><text x="1510" y="571.715" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#7655C2"><tspan x="1510" dy="0">60%</tspan></text><rect x="58" y="709" width="1483" height="107" rx="16" fill="#FFF6E9" stroke="#FFE3B7" stroke-width="1.4"/><text x="88" y="756.74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="88" dy="0">局部 kernel 2×  ≠  整体 2×。</tspan><tspan x="88" dy="31.9">先问：原本它占关键路径多少？是否已有重叠？新瓶颈会不会转移？</tspan></text></svg>
