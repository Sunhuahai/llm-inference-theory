<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="03｜收益预测与实验校准"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F6F8FC" stroke="#F6F8FC" stroke-width="1.4"/><rect x="0" y="0" width="1920" height="9" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="64" y="48.215" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#2765D8"><tspan x="64" dy="0">CEILING / CACHE HIT / COMPRESSION / VALIDATION</tspan></text><text x="64" y="109.405" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="39" font-weight="700" fill="#14243B"><tspan x="64" dy="0">收益天花板与缓存—压缩联合预测</tspan></text><text x="64" y="161.505" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#60718A"><tspan x="64" dy="0">关键路径、资源容量与前缀命中分账；将有限缓存和输入压缩的质量代价纳入同一请求 trace。</tspan></text><line x1="64" y1="188" x2="1856" y2="188" stroke="#DCE5F0" stroke-width="2"/><text x="64" y="1055.135" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#60718A"><tspan x="64" dy="0">QWEN · H800    固定 checkpoint / 固定精度 / 固定 GPU 预算    ·    研究模型 ≠ H800 实测</tspan></text><text x="1855" y="1057.19" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2765D8"><tspan x="1855" dy="0">03</tspan></text><rect x="64" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="64" y="220" width="8" height="123" rx="0" fill="#2765D8" stroke="#2765D8" stroke-width="1.4"/><text x="86" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="86" dy="0">输入 A · 实测基线</tspan></text><text x="87" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="87" dy="0">TTFT/TPOT 与 Prefill 冷热配对；trace 顺序、</tspan><tspan x="87" dy="24.65">输入/输出长度与饱和输出 tok/s。</tspan></text><rect x="673" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="673" y="220" width="8" height="123" rx="0" fill="#078E87" stroke="#078E87" stroke-width="1.4"/><text x="695" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="695" dy="0">输入 B · Profile</tspan></text><text x="696" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="696" dy="0">关键路径、资源忙碌与 Roofline 下界；</tspan><tspan x="696" dy="24.65">每前缀 state MiB、restore、eviction 与来源层级。</tspan></text><rect x="1282" y="220" width="575" height="123" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><rect x="1282" y="220" width="8" height="123" rx="0" fill="#7655C2" stroke="#7655C2" stroke-width="1.4"/><text x="1304" y="258.69" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#14243B"><tspan x="1304" dy="0">输入 C · 候选方案</tspan></text><text x="1305" y="293.89" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="1305" dy="0">cache MiB/前缀键/命中；压缩后 token、耗时、</tspan><tspan x="1305" dy="24.65">质量门槛；k_s/k_c/η、MTP 与资源因子。</tspan></text><rect x="64" y="369" width="1102" height="466" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="89" y="407.77" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#2765D8"><tspan x="89" dy="0">计算式：延迟、缓存、质量与容量各自设限</tspan></text><rect x="87" y="428" width="516" height="178" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="1.4"/><text x="107" y="465.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2765D8"><tspan x="107" dy="0">01  ·  关键路径 + Roofline</tspan></text><text x="107" y="531.39" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#14243B"><tspan x="107" dy="0">t′_b = s/k_s + c′ + m′ − η′ min(c′,m′) + h</tspan><tspan x="107" dy="24.65">c′ ≥ max(c/k_c, FLOPs/P_eff, Bytes/BW_eff)</tspan></text><rect x="637" y="428" width="516" height="178" rx="16" fill="#E3F5F1" stroke="#E3F5F1" stroke-width="1.4"/><text x="657" y="465.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#078E87"><tspan x="657" dy="0">02  ·  MTP + 饱和容量</tspan></text><text x="657" y="519.065" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#14243B"><tspan x="657" dy="0">TPOT_MTP ≈ T_verify/E[K]；E[K]=Σ(i=0..d)p^i</tspan><tspan x="657" dy="24.65">R′cap = R0 · max(u_r) / max(u_r f_r)</tspan><tspan x="657" dy="24.65">R_served ≤ min(λ × E[O], R′cap)</tspan></text><rect x="87" y="626" width="516" height="178" rx="16" fill="#F0EBFA" stroke="#F0EBFA" stroke-width="1.4"/><text x="107" y="663.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#7655C2"><tspan x="107" dy="0">03  ·  Prefix 命中与缓存成本</tspan></text><text x="107" y="729.39" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#14243B"><tspan x="107" dy="0">h_req = ΣH_i / N；h_tok = Σ(H_i P_i)/ΣL_i</tspan><tspan x="107" dy="24.65">T_cache = F + ℓ + (1−H)C + H(S+R)</tspan></text><rect x="637" y="626" width="516" height="178" rx="16" fill="#FFF1DB" stroke="#FFF1DB" stroke-width="1.4"/><text x="657" y="663.295" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#C9771A"><tspan x="657" dy="0">04  ·  上下文压缩 + 质量门槛</tspan></text><text x="657" y="717.065" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#14243B"><tspan x="657" dy="0">T_combo = F+A+ℓ′+(1−H′)C′+H′(S′+R′)</tspan><tspan x="657" dy="24.65">A &lt; C−C′（冷态盈亏）；Quality ≥ Q_min</tspan><tspan x="657" dy="24.65">S_abs = T0/F（全 Prefill 消失的极松上界）</tspan></text><rect x="1199" y="369" width="656" height="466" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1221" y="409.875" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#7655C2"><tspan x="1221" dy="0">合成情景：缓存容量与压缩交互</tspan></text><rect x="1221" y="428" width="215" height="33" rx="16" fill="#FBEAF0" stroke="#FBEAF0" stroke-width="1.4"/><text x="1328.5" y="449.53" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#C64F64"><tspan x="1328.5" dy="0">SYNTHETIC · 非实测</tspan></text><rect x="1222" y="482" width="610" height="47" rx="0" fill="#E9EEF5" stroke="#E9EEF5" stroke-width="1.4"/><text x="1233" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1233" dy="0">情景</tspan></text><text x="1450" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1450" dy="0">TTFT ms</tspan></text><text x="1580" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1580" dy="0">请求 hit</tspan></text><text x="1682" y="512.11" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#14243B"><tspan x="1682" dy="0">vs 冷原文</tspan></text><rect x="1222" y="529" width="610" height="47" rx="0" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="559.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2765D8"><tspan x="1233" dy="0">原文：无缓存</tspan></text><text x="1450" y="559.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1450" dy="0">121.50</tspan></text><text x="1580" y="559.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1580" dy="0">0%</tspan></text><text x="1682" y="559.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1682" dy="0">1.000×</tspan></text><rect x="1222" y="576" width="610" height="47" rx="0" fill="#F4F7FA" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="606.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#078E87"><tspan x="1233" dy="0">原文：40 MiB LRU</tspan></text><text x="1450" y="606.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1450" dy="0">114.62</tspan></text><text x="1580" y="606.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1580" dy="0">12.5%</tspan></text><text x="1682" y="606.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1682" dy="0">1.060×</tspan></text><rect x="1222" y="623" width="610" height="47" rx="0" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="653.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7655C2"><tspan x="1233" dy="0">原文：无限完整键</tspan></text><text x="1450" y="653.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1450" dy="0">86.00</tspan></text><text x="1580" y="653.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1580" dy="0">62.5%</tspan></text><text x="1682" y="653.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1682" dy="0">1.413×</tspan></text><rect x="1222" y="670" width="610" height="47" rx="0" fill="#F4F7FA" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="700.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7655C2"><tspan x="1233" dy="0">原文：免费命中</tspan></text><text x="1450" y="700.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1450" dy="0">60.62</tspan></text><text x="1580" y="700.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1580" dy="0">62.5%</tspan></text><text x="1682" y="700.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1682" dy="0">2.004×</tspan></text><rect x="1222" y="717" width="610" height="47" rx="0" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1233" y="747.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#C9771A"><tspan x="1233" dy="0">压缩+LRU*</tspan></text><text x="1450" y="747.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1450" dy="0">75.92</tspan></text><text x="1580" y="747.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1580" dy="0">50.0%</tspan></text><text x="1682" y="747.61" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#14243B"><tspan x="1682" dy="0">1.600×</tspan></text><text x="1225" y="795.39" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#60718A"><tspan x="1225" dy="0">*压缩质量未验证；8 个虚构请求，非 H800 实测。</tspan><tspan x="1225" dy="24.65">仅预测低载 TTFT；饱和 TPS 仍需另测资源需求。</tspan></text><rect x="64" y="859" width="1791" height="152" rx="16" fill="#EDF2F9" stroke="#DCE5F0" stroke-width="1.4"/><text x="85" y="893.085" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#14243B"><tspan x="85" dy="0">模型校准与验证闭环</tspan></text><rect x="88" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="277" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="277" dy="0">固定基线</tspan></text><text x="279.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="279.5" dy="0">模型 / 精度 / GPU / 有序 trace</tspan></text><line x1="477" y1="947" x2="519" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="531" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="720" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="720" dy="0">三层天花板</tspan></text><text x="722.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="722.5" dy="0">免费 oracle / 无淘汰 / 有限容量</tspan></text><line x1="920" y1="947" x2="962" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="974" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1163" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="1163" dy="0">单变量 A/B</tspan></text><text x="1165.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="1165.5" dy="0">均值 + 分位数 + 质量</tspan></text><line x1="1363" y1="947" x2="1405" y2="947" stroke="#2765D8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1417" y="908" width="383" height="81" rx="12" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1.4"/><text x="1606" y="936.9" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#14243B"><tspan x="1606" dy="0">误差更新</tspan></text><text x="1608.5" y="969.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#60718A"><tspan x="1608.5" dy="0">(预测−实测)/实测；留出集</tspan></text><text x="960" y="1027.82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#C64F64"><tspan x="960" dy="0">模型：predict.py（关键路径/容量） + cache_context.py（Prefix/压缩）    ·    无真实 H800 trace / 质量结果时不宣称收益。</tspan></text></svg>
