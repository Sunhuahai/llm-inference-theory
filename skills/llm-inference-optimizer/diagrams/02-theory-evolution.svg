<rect x="360" y="205" width="480" height="70" rx="9" fill="#E7F7F2" stroke="#16846B" stroke-width="1.7"/><text x="600" y="234" font-size="20" text-anchor="middle" font-weight="700" fill="#125844">历史可比实测与事前误差</text><text x="600" y="259" font-size="15" text-anchor="middle" fill="#344258">区分点预测、区间覆盖和严格界</text>
<rect x="360" y="310" width="480" height="70" rx="9" fill="#F1EBFF" stroke="#7950C6" stroke-width="1.7"/><text x="600" y="339" font-size="20" text-anchor="middle" font-weight="700" fill="#50328E">提出候选 M′ₖ</text><text x="600" y="364" font-size="15" text-anchor="middle" fill="#344258">拟合 / 修正 / 扩展 / 经验律 / 修订</text>
<rect x="360" y="415" width="480" height="70" rx="9" fill="#FFF3DD" stroke="#B87316" stroke-width="1.7"/><text x="600" y="444" font-size="20" text-anchor="middle" font-weight="700" fill="#784A0D">预登记留出实验，冻结双版本预测</text><text x="600" y="469" font-size="15" text-anchor="middle" fill="#344258">同 parent、context、指标和真实观测</text>
<rect x="360" y="520" width="480" height="70" rx="9" fill="#FFF3DD" stroke="#B87316" stroke-width="1.7"/><text x="600" y="549" font-size="20" text-anchor="middle" font-weight="700" fill="#784A0D">比较成对误差 + 独立审核</text><text x="600" y="574" font-size="15" text-anchor="middle" fill="#344258">全部登记轮次；目标不退步且至少一项改善</text>
<rect x="80" y="650" width="480" height="75" rx="9" fill="#F0F3F7" stroke="#8392A5" stroke-width="1.7"/><text x="320" y="681.5" font-size="20" text-anchor="middle" font-weight="700" fill="#344258">验证不通过 / 证据不足</text><text x="320" y="706.5" font-size="15" text-anchor="middle" fill="#344258">保留 Mₖ、候选、失败证据；不放宽标准</text>
<rect x="640" y="650" width="480" height="75" rx="9" fill="#F1EBFF" stroke="#7950C6" stroke-width="1.7"/><text x="880" y="681.5" font-size="20" text-anchor="middle" font-weight="700" fill="#50328E">通过并获真实审核授权</text><text x="880" y="706.5" font-size="15" text-anchor="middle" fill="#344258">晋升 Mₖ₊₁；旧版本与证据可追溯</text>
<text x="715" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#77869B" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">有充分修订依据</text>
<text x="445" y="610" text-anchor="middle" font-size="15" font-weight="600" fill="#77869B" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">否</text>
<text x="755" y="610" text-anchor="middle" font-size="15" font-weight="600" fill="#77869B" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">是</text>
<text x="174" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="#8392A5" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">保留现有版本</text>
