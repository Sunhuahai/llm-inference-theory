<svg xmlns="http://www.w3.org/2000/svg" width="900" height="568" viewBox="0 0 900 568" role="img"><title>GEAK v4：系统层与 Kernel 层的嵌套优化</title><rect width="100%" height="100%" rx="14" fill="#fff"/><g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><text x="450" y="38" font-size="25" text-anchor="middle" fill="#1e293b" font-weight="700">GEAK v4：系统层与 Kernel 层的嵌套优化</text><rect x="220" y="63" width="460" height="66" rx="10" stroke="#1d4ed8" stroke-width="1.6" fill="#eff6ff"/><text x="450" y="92" font-size="22" text-anchor="middle" fill="#1d4ed8" font-weight="700">服务层优化器</text><text x="450" y="116" font-size="17" text-anchor="middle" fill="#1e293b">固定负载、目标与基线；定位热点</text><line x1="450" y1="129" x2="450" y2="155" stroke="#64748b" stroke-width="2" /><path d="M445.21537912477646 145.09508187412055 L450 155 L454.78462087522354 145.09508187412055" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="155" width="460" height="65" rx="10" stroke="#6d28d9" stroke-width="1.6" fill="#f5f3ff"/><text x="450" y="184" font-size="22" text-anchor="middle" fill="#6d28d9" font-weight="700">低成本候选筛选</text><text x="450" y="208" font-size="17" text-anchor="middle" fill="#1e293b">配置 / 现有后端 / 资源上限</text><line x1="450" y1="220" x2="450" y2="250" stroke="#64748b" stroke-width="2" /><path d="M445.21537912477646 240.09508187412055 L450 250 L454.78462087522354 240.09508187412055" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="250" width="460" height="65" rx="10" stroke="#0f766e" stroke-width="1.6" fill="#f0fdfa"/><text x="450" y="279" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="700">局部 Kernel 优化器</text><text x="450" y="303" font-size="17" text-anchor="middle" fill="#1e293b">并行候选；独立验证；组合有效 patch</text><line x1="450" y1="315" x2="450" y2="345" stroke="#64748b" stroke-width="2" /><path d="M445.21537912477646 335.0950818741206 L450 345 L454.78462087522354 335.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="345" width="460" height="65" rx="10" stroke="#b45309" stroke-width="1.6" fill="#fffbeb"/><text x="450" y="374" font-size="22" text-anchor="middle" fill="#b45309" font-weight="700">真实服务 A/B</text><text x="450" y="398" font-size="17" text-anchor="middle" fill="#1e293b">TTFT、TPOT、吞吐、质量、稳定性</text><line x1="450" y1="410" x2="450" y2="438" stroke="#64748b" stroke-width="2" /><path d="M445.21537912477646 428.0950818741206 L450 438 L454.78462087522354 428.0950818741206" stroke="#64748b" stroke-width="2" fill="none"/><rect x="220" y="438" width="460" height="65" rx="10" stroke="#475569" stroke-width="1.6" fill="#f1f5f9"/><text x="450" y="467" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">保留或回滚</text><text x="450" y="491" font-size="17" text-anchor="middle" fill="#1e293b">仅接受独立复测通过的改动</text><path d="M680 470 H840 V96 H682" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/><line x1="710" y1="96" x2="682" y2="96" stroke="#64748b" stroke-width="2" /><path d="M691.9049181258795 91.21537912477646 L682 96 L691.9049181258795 100.78462087522354" stroke="#64748b" stroke-width="2" fill="none"/><text x="760" y="278" font-size="18" text-anchor="middle" fill="#475569">重新定位</text><text x="760" y="299" font-size="18" text-anchor="middle" fill="#475569">瓶颈</text><text x="450" y="540" font-size="17" text-anchor="middle" fill="#475569">确定性控制器负责预算与测试；LLM 负责技术判断和代码实现。</text></g></svg>